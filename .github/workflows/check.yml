name: Проверка сайта отключений

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Скачать проект
        uses: actions/checkout@v4
      - name: Подготовить Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Установить зависимости
        run: npm install
      - name: Установить браузер
        run: npx playwright install --with-deps chromium
      - name: Проверить сайт
        run: npm run check
