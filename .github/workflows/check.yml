name: Проверка сайта отключений

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Скачать проект
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - name: Подготовить Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 22
      - name: Проверить официальный источник
        run: npm run check
